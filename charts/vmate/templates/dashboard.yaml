{{- if .Values.dashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vmate.fullname" . }}-dashboard
  labels:
    {{- include "vmate.labels" . | nindent 4 }}
    {{- with .Values.dashboard.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.dashboard.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  vmate.json: |-
    {{- .Files.Get "dashboards/vmate.json" | nindent 4 }}
{{- end }}
