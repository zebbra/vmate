{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "vmate.fullname" . }}
  namespace: {{ include "vmate.targetNamespace" . }}
  labels:
    {{- include "vmate.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "vmate.fullname" . }}
  namespace: {{ include "vmate.targetNamespace" . }}
  labels:
    {{- include "vmate.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "vmate.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "vmate.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
